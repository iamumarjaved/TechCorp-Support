version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: OPENAI_API_KEY
      value: "${OPENAI_API_KEY}"
    - name: MCP_SERVER_URL
      value: "https://vipfapwm3x.us-east-1.awsapprunner.com/mcp"
    - name: LLM_MODEL
      value: "gpt-4o-mini"
    - name: DEBUG
      value: "false"
    - name: CORS_ORIGINS
      value: "*"
